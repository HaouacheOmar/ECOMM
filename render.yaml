# Render Blueprint: the Django API (free web service) and Redis (free Key Value).
# The database and media live on Supabase; fill the `sync: false` values when creating the Blueprint.
services:
  - type: web
    name: eshop-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # seed_demo does nothing once the demo data exists.
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /api/demo/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,.vercel.app
      - key: FRONTEND_ORIGIN
        sync: false # https://<your-app>.vercel.app
      - key: DEMO_MODE
        value: "1"
      - key: CELERY_EAGER
        value: "1"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: eshop-redis
          property: connectionString
      - key: DB_HOST
        sync: false # Supabase session pooler host, e.g. aws-0-eu-central-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false # postgres.<project-ref>
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: S3_BUCKET
        value: media
      - key: S3_ENDPOINT
        sync: false # https://<project-ref>.supabase.co/storage/v1/s3
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false # https://<project-ref>.supabase.co/storage/v1/object/public/media

  - type: keyvalue
    name: eshop-redis
    plan: free
    ipAllowList: [] # reachable only from Render services
